# =============================================================================
# Nginx Reverse Proxy Configuration
# Handles: rate limiting, gzip, security headers, static caching, API proxy,
#          HTTP→HTTPS redirect, and file upload size.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones (defined in http context — these directives are included
# inside a virtual-host conf file, so they require an http-context wrapper when
# used standalone; in Docker Compose this file is mounted as conf.d/*.conf
# and Nginx will include it inside the http block automatically).
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  application/xml+rss
  application/atom+xml
  image/svg+xml;

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # TLS certificates (mount via Docker volume)
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Maximum upload size (resume PDFs, etc.)
  client_max_body_size 20M;

  # ---------------------------------------------------------------------------
  # Security headers
  # ---------------------------------------------------------------------------
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; frame-ancestors 'none';" always;

  # ---------------------------------------------------------------------------
  # Cache static Next.js assets aggressively (content-addressed filenames)
  # ---------------------------------------------------------------------------
  location /_next/static/ {
    proxy_pass http://frontend:3000;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_set_header Host $host;
  }

  # ---------------------------------------------------------------------------
  # Public static files (shorter cache)
  # ---------------------------------------------------------------------------
  location /public/ {
    proxy_pass http://frontend:3000;
    add_header Cache-Control "public, max-age=86400";
    proxy_set_header Host $host;
  }

  # ---------------------------------------------------------------------------
  # API proxy → backend service
  # Rate-limited to 30 req/min per IP.
  # ---------------------------------------------------------------------------
  location /api/v1/ {
    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # ---------------------------------------------------------------------------
  # Next.js app (all other routes)
  # ---------------------------------------------------------------------------
  location / {
    limit_req zone=general_limit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }
}
